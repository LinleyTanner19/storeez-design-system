<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Storeez Design System — Component Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Storeez DS type stack (handoff v2).
        Archivo            — shared --font-title, invariant across all brands (C5)
        Inter              — --font-body
        JetBrains Mono     — --font-mono
      Per-brand --font-display:
        Schibsted Grotesk  — Storeez Base (C2: replaces Bebas Neue, now dropped)
        Space Grotesk      — KUMITE
        Playfair Display   — ÎLOT (serif, intentional exception)
        Manrope            — Travelz (C3: Inter is --font-body, so it cannot be display)
        Sora               — Violet variant
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/lab/main.tsx"></script>
  </body>
